name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # gradle.properties pins org.gradle.java.home to a developer's local JDK path.
      # Override it on the command line so Gradle uses the JDK setup-java installed.
      - name: Build
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" build publishToMavenLocal
